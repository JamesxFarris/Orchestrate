# CorpseGrinder: wave killer (Vampire Survivors x Enter the Gungeon), TypeScript + Vite + Vitest.
# Ownership mirrors the repo layout: src/sim, src/data, src/core, src/render, src/art, tests/, docs/ (design docs + ADRs).
version: 1

project:
  name: CorpseGrinder
  language: TypeScript
  repoPath: ../../CorpseGrinder        # relative to this file
  defaultBranch: master
  description: >-
    A top-down wave-survival shooter: Vampire Survivors' escalating hordes, auto-weapons and level-up
    choices crossed with Enter the Gungeon's guns, bullet patterns and cathedral arenas. Fixed-step
    simulation in src/sim, data tables in src/data, canvas rendering in src/render.
  referenceDirs:
    - public/art/**          # ripped sprites (gitignored, local only)
    - tools/**               # the rip scripts document the source asset layouts
  # Decompiled game projects outside the repo, readable by every agent (never writable):
  externalReferenceDirs: []
  #  - C:/DOA-assets/vs/ExportedProject/Assets
  #  - C:/DOA-assets/gungeon/ExportedProject/Assets
  testGlobs:
    - "tests/**/*.test.ts"
  linkDirs:
    - node_modules

defaults:
  model: claude-opus-5-5
  effort: high
  maxTurns: 40
  maxBudgetUsd: 4
  timeoutMs: 1200000

gates:
  typecheck: npx tsc --noEmit
  test: npx vitest run
  testFiles: npx vitest run {files}
  full: npx vitest run
  timeoutMs: 600000

policy:
  maxRetries: 2
  maxChangedLines: 400
  circleRevisionRounds: 2
  requireHumanApproval: true
  maxParallel: 3

squads:
  - id: gameplay
    name: Gameplay
    color: "#e4572e"
    mission: Simulation rules — player, weapons, bullets, enemies, waves, combat, pickups, progression — and the data tables that tune them.
    owns: ["src/sim/**", "src/data/**"]
    testDirs: ["tests/**"]
  - id: engine
    name: Core Engine
    color: "#1985a1"
    mission: Fixed-step loop, input, events, spatial grid, pooling, RNG, math, and app bootstrap.
    owns: ["src/core/**", "src/main.ts"]
    testDirs: ["tests/**"]
  - id: render
    name: Render & UI
    color: "#f2a541"
    mission: Canvas renderer, tilemap, FX, HUD, level-up choice UI, icons, and the art pack / sprite resolver.
    owns: ["src/render/**", "src/art/**", "index.html"]
    testDirs: ["tests/**"]
  # The Architecture squad keeps the id "research" (and its role ids) so saved runs and tests still resolve.
  - id: research
    name: Architecture
    color: "#7fb7be"
    mission: >-
      Design before code. When work spans squads, adds a module or needs a design decision, write a design
      doc (docs/design/) and an ADR (docs/adr/) fixing the module boundaries and the contracts other squads
      build against. The reference games are optional input, not the purpose.
    owns: ["docs/**"]

roles:
  # --- HQ -----------------------------------------------------------------
  - { id: head-of-eng, title: VP of Engineering, kind: master, tier: exec }
  - { id: architect, title: Principal Architect, kind: architect, tier: principal, reportsTo: head-of-eng }
  - { id: head-of-qa, title: QA Manager, kind: qa_head, tier: principal, reportsTo: head-of-eng, runtime: { effort: medium } }

  # --- Gameplay -------------------------------------------------------------
  - { id: gameplay-lead, title: Tech Lead, kind: lead, tier: lead, squad: gameplay, reportsTo: head-of-eng }
  - { id: gameplay-dev, title: Software Engineer, kind: dev, tier: senior, squad: gameplay, reportsTo: gameplay-lead }
  - { id: gameplay-qa, title: QA Engineer, kind: qa, tier: ic, squad: gameplay, reportsTo: head-of-qa }

  # --- Core Engine ----------------------------------------------------------
  - { id: engine-lead, title: Tech Lead, kind: lead, tier: lead, squad: engine, reportsTo: head-of-eng }
  - { id: engine-dev, title: Software Engineer, kind: dev, tier: senior, squad: engine, reportsTo: engine-lead }
  - { id: engine-qa, title: QA Engineer, kind: qa, tier: ic, squad: engine, reportsTo: head-of-qa }

  # --- Render & UI ------------------------------------------------------------
  - { id: render-lead, title: Tech Lead, kind: lead, tier: lead, squad: render, reportsTo: head-of-eng }
  - { id: render-dev, title: Software Engineer, kind: dev, tier: senior, squad: render, reportsTo: render-lead }
  - { id: render-qa, title: QA Engineer, kind: qa, tier: ic, squad: render, reportsTo: head-of-qa }

  # --- Architecture -----------------------------------------------------------
  - { id: research-lead, title: Tech Lead, kind: lead, tier: lead, squad: research, reportsTo: head-of-eng }
  - { id: research-analyst, title: Systems Analyst, kind: analyst, tier: senior, squad: research, reportsTo: research-lead }

  # --- Optional chapters (flip enabled: true to add them to the city) --------
  - { id: head-of-product, title: Product Manager, kind: product, tier: principal, reportsTo: head-of-eng, enabled: false }
  - { id: head-of-design, title: Product Designer, kind: design, tier: principal, reportsTo: head-of-eng, enabled: false }

techCircle: [head-of-eng, architect, head-of-qa, gameplay-lead, engine-lead, render-lead, research-lead]
